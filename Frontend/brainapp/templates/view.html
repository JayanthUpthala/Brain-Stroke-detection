{% extends 'base1.html'%}
{% block code %}
<h1 style="color: white;">.</h1>
<h1 style="color: white;">.</h1>
<h1 style="color: white;">.</h1>
<center><h1><u><b>View Data</b></u></h1></center>

<style>
.card {
  box-shadow: 0 450px 8px 0 rgba(0,0,0,1.2);
  transition: 0.3s;
  width: 100%;
}

.card:hover {
  box-shadow: 0 8px 160px 0 rgba(0,0,0,0.4);
}

.container {
  padding: 2px 16px;
}
</style>
<form action="{% url 'view' %}" method="post" enctype="multipart/form-data" >
    <div class="card" style="background-color: orange; border-radius:30px;" >
    {% csrf_token %}
    <div class="about_text" style="padding-top: 50px;">
        <style >
            table,
            td {
                padding: 10px;
                border: 1px solid rgb(0, 0, 0);
                border-collapse: collapse;
            }
        </style>
        <center style="    padding-top: 20px;">
            <table style="margin-left: 4px;color:rgb(0, 0, 0);"><b>
                {{table | safe}}
                    <tr>
                        {%for c in columns%}
                        <td style="color:rgb(0, 0, 0); border-width: 20px;"><b>{{c}}</b></td>
                        {%endfor%}
                        
                    </tr>
                     
                    {%for r in rows%}
                    <tr>
                        {%for j in r%}
                        <td style="color:rgb(0, 0, 0);">{{ j }}</td>
                        {%endfor%}
                    </tr>
                    
                    {%endfor%}
                    
                </b> </table>
        </center>
    </div>
</form>

{% endblock %}
